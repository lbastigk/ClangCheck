# This file is used to configure the behavior of clangCheck, which is a wrapper around clang-tidy.

# Run clang-tidy in parallel for multiple files. Set to false to run sequentially.
use_parallel=true

# The files to check
source_directories=(
    Tests/Nebulite/include 
    Tests/Nebulite/src
)

# Files that cause issues like hangs or crashes that will be skipped during the clang-tidy run
# all entries must start with 'Tests/Nebulite/'
known_offenders=(
    "Tests/Nebulite/src/Nebulite/Module/Domain/Renderer/Audio.cpp"
)

# Map of known .tpp -> .hpp overrides.
# Keys must be the .tpp path (starting with 'Tests/Nebulite/'), values the .hpp path to use instead.
# Add entries when a .tpp's corresponding .hpp is located elsewhere or has a different name.
declare -A tpp_overrides=(
    ["Tests/Nebulite/include/Nebulite/Utility/Args/FuncTreeArgumentCompletion.tpp"]="Tests/Nebulite/include/Nebulite/Utility/Args/FuncTree.hpp"
)

# Set paths for external libraries
external_include_list=(
    "Tests/Nebulite/external/absl-src/"
    "Tests/Nebulite/external/imgui-src/"
    "Tests/Nebulite/external/imgui-src/backends"
    "Tests/Nebulite/external/implot-src/"
    "Tests/Nebulite/external/rapidjson-src/include"
    "Tests/Nebulite/external/rmlui-src/Backends"
    "Tests/Nebulite/external/rmlui-src/Include"
    "Tests/Nebulite/external/rmlui-src/Source"
    "Tests/Nebulite/external/sdl3-src/include"
    "Tests/Nebulite/external/sdl3_image-src/include"
    "Tests/Nebulite/external/sdl3_ttf-src/include"
    "Tests/Nebulite/external/stb-src"
    "Tests/Nebulite/external/tinyexpr-src"
)

# clang-tidy configuration variables
clang_tidy_build_directory=Tests/Nebulite/tmp/build_linux-debug
clang_tidy_config_file=Tests/Nebulite/.clang-tidy
clang_tidy_cpp_standard=c++26
clang_tidy_define=-DRMLUI_SDL_VERSION_MAJOR=3
clang_tidy_header_filter='^Tests/Nebulite/include/Nebulite/.*'
clang_tidy_include_directory=Tests/Nebulite/include/
clang_tidy_warning_as_errors='*'

